<!doctype html>
<!-- Nurserik Studio Hook — пример из обучения Нұрсерік: так Нұрсерік смонтировал свой креатив (PROXIMA). -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .bg-dark2 { --bg: radial-gradient(ellipse at 50% 55%, #1d3442 0%, #0b151c 55%, #05090c 100%); }
  .grid2::before { content: ''; position: absolute; inset: 0; opacity: .55;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 60px 60px; }
  .ph { position: absolute; border-radius: 44px; overflow: hidden; background: #000; box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 4px rgba(255,255,255,.2); }
  .ph img.seq { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .lbl2 { font: 800 28px Inter; letter-spacing: 1px; padding: 9px 20px; border-radius: 30px; background: rgba(0,0,0,.7); color: #fff; white-space: nowrap; display: flex; gap: 10px; align-items: center; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
  .head1 { font: 400 50px Inter; letter-spacing: -1.5px; color: rgba(255,255,255,.88); white-space: nowrap; }
  .head2 { font: 800 104px Inter; letter-spacing: -5px; line-height: 1; white-space: nowrap;
    background: linear-gradient(180deg, #fff 30%, #b9b9b9 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cta1 { font: 400 40px Inter; letter-spacing: -1px; color: rgba(255,255,255,.88); white-space: nowrap; }
  .ctab { display: flex; align-items: center; justify-content: center; gap: 18px; height: 108px; padding: 0 44px; border-radius: 60px; background: #DFFF1F; color: #111;
    font: 800 44px Inter; letter-spacing: -1px; white-space: nowrap; box-shadow: 0 24px 60px rgba(223,255,31,.25); }
</style></head>
<body data-frames="1410" data-dur="47.00" data-intro="none">
<svg width="0" height="0" style="position:absolute"><defs>
  <g id="star" fill="#D97757"><path id="ray" d="M-4 -4 L-6 -44 Q0 -48 6 -44 L4 -4 Z"/>
    <use href="#ray" transform="rotate(36)"/><use href="#ray" transform="rotate(72)"/><use href="#ray" transform="rotate(108)"/><use href="#ray" transform="rotate(144)"/>
    <use href="#ray" transform="rotate(180)"/><use href="#ray" transform="rotate(216)"/><use href="#ray" transform="rotate(252)"/><use href="#ray" transform="rotate(288)"/><use href="#ray" transform="rotate(324)"/></g>
</defs></svg>
<div id="stage">
  <img id="ext"><div id="cam" class="cam"><img id="vid"></div><div id="behind"></div><div id="camc" class="cam"><img id="cut"></div>
  <div id="shade"></div>

  <section class="scene full bg-dark2 grid2" data-s="0" data-e="47.00" data-push="0.015">
    <!-- заголовок сверху: тонкая строка + жирное слово -->
    <div class="head2 cx" style="top:226px;font-size:84px;letter-spacing:-4px" data-in="0" data-fx="none">монтажға қолымның</div>
    <div class="head2 cx" style="top:304px;font-size:84px;letter-spacing:-4px" data-in="0" data-fx="none">ұшын да тигізбедім<span class="dot">.</span></div>

    <!-- ДЕЙІН: сырой исходник креатива 3 -->
    <div class="abs" style="left:46px;top:760px;rotate:-7deg">
      <div class="ph" style="left:0;top:0;width:330px;height:587px" data-in="0" data-fx="none" data-from="left" data-dist="200">
        <img class="seq" data-seq="media/before/" data-f0="1" data-nf="1366"></div>
      <div class="lbl2 abs" style="left:-8px;top:-28px" data-in="0" data-fx="none">ДЕЙІН</div>
    </div>

    <!-- стрелка -->
    <svg class="abs" style="left:150px;top:470px" width="330" height="290" data-in="0" data-fx="none"><path d="M30 280 C 40 140, 150 60, 300 60 M272 34 L302 60 L272 87" style="fill:none;stroke:#9fd4ff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round"/></svg>

    <!-- КЕЙІН: готовый монтаж (звук только отсюда) -->
    <div class="ph" style="left:470px;top:460px;width:540px;height:960px" data-in="0" data-fx="none" data-from="bottom" data-dist="160">
      <img class="seq" data-seq="media/after/" data-f0="1" data-nf="1410"></div>
    <div class="lbl2 abs" style="left:830px;top:432px;z-index:5" data-in="0" data-fx="none">
      <svg viewBox="-50 -50 100 100" style="width:26px;height:26px"><use href="#star"/></svg>КЕЙІН</div>

    <!-- призыв снизу -->
    <div class="cta1 cx" style="top:1458px" data-in="0" data-fx="none">Claude-пен монтаж жасауды үйренгің келсе,</div>
    <div class="ctab cx" style="top:1516px" data-in="0" data-fx="none">
      <svg width="46" height="46" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/></svg>сілтемені бас</div>
  </section>
</div>
<script src="engine.js"></script>
</body></html>
